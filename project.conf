# =============================================================================
# project.conf — Single configuration file for the ESP32 EPICS project
#
# USAGE:
#   1. Edit ONLY this file with your environment settings.
#   2. Run `make all` from the project root to build everything.
#
# The root Makefile reads this file and automatically:
#   - Writes epics_ioc/configure/RELEASE with the correct EPICS paths
#   - Writes firmware/sdkconfig.defaults with WiFi/GPIO/UART settings
# =============================================================================

# --- ESP32 Firmware ---
FIRMWARE_PORT = /dev/ttyACM1
FIRMWARE_BAUD    = 115200           # UART baud rate (EPICS IOC side must match)
WIFI_SSID        = XXXXXX       # WiFi SSID for TCP transport
WIFI_PASSWORD    = xxxxxxx    # WiFi WPA2 password
TCP_PORT         = 7070             # TCP port for WiFi command server
WEBUI_PORT       = 80               # HTTP port for Web UI dashboard
ESP32_LED_GPIO   = 2                # GPIO pin used for the LED test

# --- EPICS IOC ---
EPICS_BASE       = /home/vasu-hdd/EPICS/base-7.0.8.1
ASYN_PATH        = /home/vasu-hdd/EPICS/support/asyn
STREAM_PATH      = /home/vasu-hdd/EPICS/support/stream/StreamDevice
SERIAL_PORT = /dev/ttyACM1
ESP32_IP         = 192.168.1.110    # IP address for WiFi mode (leave blank for serial-only)

# --- Paths --- (do not change unless you moved the toolchains)
IDF_PATH         = /home/vasu-hdd/.espressif/v5.5.3/esp-idf
IDF_VENV         = /home/vasu-hdd/.espressif/python_env/idf5.5_py3.12_env
